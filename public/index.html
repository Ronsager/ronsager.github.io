<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Trek Conquest</title>
<meta name="description" content="Browserbasiertes Weltraum-Strategiespiel im Star-Trek-Universum">
<link rel="stylesheet" href="/css/lcars.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🖖</text></svg>">
</head>
<body>

<!-- ══════════ Anmeldung ══════════ -->
<div class="auth-screen active" id="auth-screen">
  <div class="auth-box">
    <div class="auth-crest" id="auth-crest"></div>
    <div class="logo">
      <div class="title">Star Trek</div>
      <div class="title" style="font-size:1.3rem">Conquest</div>
      <div class="sub">Sternenflottenkommando</div>
    </div>
    <div class="panel accent-orange">
      <div class="tabs">
        <button id="tab-login" class="active">Anmelden</button>
        <button id="tab-register">Neues Kommando</button>
      </div>
      <div id="auth-alert"></div>

      <form id="login-form">
        <div class="field">
          <label for="login-name">Kommandant oder E-Mail</label>
          <input id="login-name" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-pass">Zugangscode</label>
          <input id="login-pass" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" style="width:100%">Verbindung herstellen</button>
      </form>

      <form id="register-form" style="display:none">
        <div class="field">
          <label for="reg-name">Kommandantenname</label>
          <input id="reg-name" autocomplete="username" minlength="3" maxlength="20" required>
        </div>
        <div class="field">
          <label for="reg-email">E-Mail</label>
          <input id="reg-email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="reg-pass">Zugangscode (min. 8 Zeichen)</label>
          <input id="reg-pass" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label>Fraktion <span class="req">— Pflichtangabe, später nicht änderbar</span></label>
          <div class="faction-picker" id="faction-picker"></div>
        </div>
        <button type="submit" style="width:100%">Kommando übernehmen</button>
      </form>
    </div>
    <p class="small muted center" id="motd"></p>
    <p class="tiny muted center" id="auth-version"></p>
  </div>
</div>

<!-- ══════════ Spiel ══════════ -->
<div class="app" id="app">
  <!-- ══ LCARS-Rahmen: Kopfzeile mit Winkelelement ══ -->
  <header class="lcars-head">
    <div class="lcars-elbow-tl"></div>
    <div class="lcars-head-bar">
      <span class="lcars-cap-l"></span>
      <span class="lcars-title">Star Trek Conquest</span>
      <span class="lcars-block c-lilac"></span>
      <span class="lcars-block c-blue"></span>
      <span class="lcars-headinfo" id="header-player"></span>
      <span class="lcars-fill"></span>
      <span class="lcars-stardate mono" id="server-time"></span>
      <button class="lcars-btn c-salmon" id="btn-logout">Abmelden</button>
      <span class="lcars-cap-r"></span>
    </div>
  </header>

  <div class="lcars-body">
    <!-- ══ Linke LCARS-Säule: Navigation ══ -->
    <nav class="lcars-column">
      <div class="lcars-column-inner" id="sidebar"></div>
      <div class="lcars-column-foot">
        <span class="lcars-seg c-tan"></span>
        <span class="lcars-seg c-lilac"></span>
        <span class="lcars-seg c-orange"></span>
      </div>
    </nav>

    <!-- ══ Hauptbereich ══ -->
    <div class="lcars-main">
      <div class="resource-bar" id="resource-bar"></div>
      <main id="view"><div class="loader">Sensoren kalibrieren</div></main>
    </div>
  </div>

  <!-- ══ Fußleiste mit unterem Winkelelement ══ -->
  <footer class="lcars-foot">
    <div class="lcars-elbow-bl"></div>
    <div class="lcars-foot-bar">
      <span class="lcars-cap-l"></span>
      <span class="lcars-block c-tan"></span>
      <span class="lcars-block c-lilac"></span>
      <span class="lcars-fill"></span>
      <span class="lcars-code mono" id="version-info">LCARS 47-2213-A</span>
      <span class="lcars-cap-r"></span>
    </div>
  </footer>
</div>

<div id="tutorial" class="hidden"></div>
<div id="changelog" class="hidden"></div>
<div id="toasts"></div>
<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal" id="modal"></div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
