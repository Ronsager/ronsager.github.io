# Reverse-Proxy mit HTTPS für den öffentlichen Betrieb.
# Zertifikat z. B. per:  sudo certbot --nginx -d spiel.example.com

server {
    listen 80;
    listen [::]:80;
    server_name spiel.example.com;
    # Alles auf HTTPS umleiten
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name spiel.example.com;

    ssl_certificate     /etc/letsencrypt/live/spiel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spiel.example.com/privkey.pem;

    # Sicherheitsheader (die App setzt zusätzlich eigene per helmet)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
